# 多通道定位 · 页面类型（PageProfile）资源包
# 修改本文件后重启服务生效；也可设置环境变量 LOCATE_PROFILES_PATH 指向自定义路径
#
# 匹配顺序：自上而下，首个命中（label 或 screen_text）生效；generic 兜底。
# 更具体的页面类型必须写在更宽泛的 login / home 之前。
version: 2

bootstrap_rules:
  # OCR 全文优先（在遍历 profiles 之前）
  - profile: system_dialog
    screen_text_patterns:
      - "仅在使用中允许|始终允许|是否.{0,8}允许|获取已安装|获取.*应用.*信息"
  - profile: verify_code
    screen_text_patterns:
      - "输入验证码|请输入验证码|填写验证码|6位验证码|四位验证码|短信验证码|验证码已发送"
  - profile: phone_login
    screen_text_patterns:
      - "请输入手机号|输入手机号码|手机号登录|短信登录|验证码登录|获取验证码"
  - profile: one_click_login
    screen_text_patterns:
      - "本机号码一键登录|手机号一键登录|运营商.*一键登录|认证服务由.*提供"
  - profile: password_login
    screen_text_patterns:
      - "请输入密码|账号密码登录|密码登录|邮箱登录|用户名或邮箱"
  - profile: phone_register
    screen_text_patterns:
      - "注册账号|手机号注册|新用户注册|设置登录密码|确认密码"

profiles:
  # ── 弹窗 / 系统 ─────────────────────────────────────────
  - key: consent
    title: 隐私同意弹窗
    label_patterns:
      - consent
      - 隐私同意
      - 协议弹
      - 用户协议与隐私
    screen_text_patterns:
      - 不同意
      - 造物者
      - 隐私条款
      - 用户协议
      - 点击.*同意
      - 同意并继续
    weights:
      clip: 0.24
      ocr: 0.42
      hierarchy: 0.38
      gallery: 0.12
      icon_row: 0.08
      anchor: 0.55
    prefer_icon_row: false
    description: 首次启动协议弹窗；同意/不同意按钮，优先 OCR/hierarchy

  - key: system_dialog
    title: 系统权限 / 系统弹窗
    label_patterns:
      - 系统权限
      - 权限弹窗
      - permission
      - 允许访问
    screen_text_patterns:
      - 仅在使用中允许
      - 始终允许
      - 是否.*允许
      - 获取.*信息
      - 拒绝
      - 要允许.*吗
    weights:
      clip: 0.22
      ocr: 0.38
      hierarchy: 0.42
      gallery: 0.18
      icon_row: 0.12
      anchor: 0.55
    prefer_icon_row: false
    description: Android/iOS 系统权限框

  - key: modal
    title: 业务弹窗 / 对话框
    label_patterns:
      - 弹窗
      - 对话框
      - modal
      - dialog
      - 提示框
    screen_text_patterns:
      - 确定要
      - 是否确认
      - 温馨提示
      - 取消
      - 知道了
    weights:
      clip: 0.26
      ocr: 0.40
      hierarchy: 0.34
      gallery: 0.14
      icon_row: 0.08
      anchor: 0.55
    prefer_icon_row: false
    description: App 内居中/底部业务弹窗（非系统权限、非协议全屏）

  # ── 登录 / 注册链路（细粒度，须在 login 之前）────────────
  - key: verify_code
    title: 验证码输入页
    label_patterns:
      - 验证码
      - 短信验证
      - verify\s*code
      - sms\s*code
      - 输入验证码
    screen_text_patterns:
      - 输入验证码
      - 请输入验证码
      - 重新获取
      - 秒后重发
      - 验证码已发送
      - 6位验证码
    weights:
      clip: 0.20
      ocr: 0.38
      hierarchy: 0.40
      gallery: 0.12
      icon_row: 0.08
      anchor: 0.55
    prefer_icon_row: false
    description: 六位/四位短信验证码输入、重发倒计时

  - key: phone_register
    title: 手机号注册页
