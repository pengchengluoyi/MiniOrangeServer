# 造好物 UI 画像
#
# 这些字面量原来写死在通用服务的 Python 控制流里：
#   server/services/case_precondition_service.py:238        登录判定的底栏 tab
#   server/services/shared/page_context/page_context_service.py:509,526,683   首页 / 协议页识别
#   server/services/local/navigation/page_navigation_service.py:24,698        导航 tab、协议页
#   server/services/copilot_service.py:170                  分段 tab 识别
#   server/services/shared/semantic/expectation_semantic_service.py:141       断言特判
#   server/services/figma_logic_service.py:29               页面归类
#   server/services/app_automation_service.py:568           变量名叫 generic_markers、内容是造好物
#   server/services/local/locate/clip_locate_service.py:161 分段 tab
#
# 搬到这里是**纯搬家**，行为必须完全不变。通用词（首页/我的/消息/用户协议/推荐…）留在
# app_profile.py 的 GENERIC_* 常量里，不重复写在这。
#
# 改这个文件不需要重启逻辑改动；调用 app_profile.reload_profiles() 或重启服务生效。

key: zaohaowu
label: 造好物
packages:
  - com.mathmagic.zaohaowu

# 导航目标（原 page_navigation_service.BOTTOM_TAB_LABELS / SEGMENT_TAB_LABELS）
bottom_tabs:
  - 首页
  - 消息
  - 我的
  - 想要
segment_tabs:
  - 造物秀
  - AI创意
  - 想要成真

# 只用于识别、不作导航目标（原 copilot_service._SEGMENT_TAB_NAMES 的额外项）
segment_tab_aliases:
  - 真造物秀
  - 怪兽
  - 艺术家专区

# 「底栏主导航齐全 ⇒ 已登录」用的清单。注意和 bottom_tabs 不同：
# 原 case_precondition_service._main_tab_bar_logged_in 用的是「首页/造物秀/消息/我的」，
# 混进了一个分段 tab，因为首页 chrome 上它总是可见。保持原样。
logged_in_tabs:
  - 首页
  - 造物秀
  - 消息
  - 我的
logged_in_tab_hits: 3

# 处于这些页面视为已登录（原 case_precondition_service.py:292 的 label in (...)）
logged_in_pages:
  - 首页
  - 消息
  - 我的
  - 造物秀

# 协议全文页的应用专属文案（通用的「平台用户协议」「用户协议」见 GENERIC_LEGAL_MARKERS）
# 两种空格写法都要留 —— OCR 有时会把「造好物 - 平台」识别成「造好物- 平台」。
legal_page_markers:
  - 造好物 - 平台
  - 造好物- 平台

# 「应用已在前台」的应用专属文案（原 app_automation_service.py 那个误名为 generic_markers 的常量）
foreground_markers:
  - 造物者
  - 造好物
  - 造物者，你好

# 这个应用有哪几个端。脑图第一层按它拆，也决定 draft_mindmap 分几次调模型。
# 端到端（e2e）不用写：有两个以上真实端时自动加上。
# 通用端名和别名（App / Web / 运营平台 / 后台 / CMS…）在 app_profile.GENERIC_SURFACES 里，
# 属于产业词不是业务词，所以这里只声明「有哪些」，不重复写别名。
# 非标准端才需要展开写，例如：
#   - id: miniapp
#     label: 小程序
#     aliases: [小程序, 微信小程序]
surfaces:
  - app
  - web

# 术语表：archetype 一旦标上，page_archetypes 的必测维度就自动对这个应用生效
# （见 docs/plan-qa-role-quality-v2.md 3.4 / 3.5）
lexicon:
  - term: 造物秀
    means: 用户发布的作品动态流
  - term: 定制页
    archetype: detail
    means: 单个可定制商品的详情与下单页
  - term: 定制模版页
    archetype: list
    means: 从「我的」进入的可选模版列表
  - term: 传图定制
    means: 上传本地图片后下单
  - term: 创意定制
    means: 与 agent 对话生成图片后下单
  - term: 模型管理
    archetype: backend_config
    means: 运营平台上的可用模型配置
  - term: 定制专区
    archetype: backend_config
    means: 运营平台上的定制入口配置
