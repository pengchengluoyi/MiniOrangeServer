id: read_device_data
display_name: 读取设备数据
event_kind: read_device_data
category: system
description: |
  读取屏幕看不到的设备底层数据（SIM 卡状态、运营商、本机号码、设备型号、系统属性等）。
  这类数据无法通过截图获得，只能通过 shell 或系统 API。Remote 不可用时该 plugin 自动消失。
platforms: [android, ios]
trigger_phrases: [SIM卡, 手机卡, 本机号码, 系统属性, 设备型号]
needs_vlm: false

implementations:
  - id: remote_getprop
    display_name: Remote RUN_SHELL getprop
    executor: remote
    requires_caps: [read_system_data]
    needs_vlm: false
    low_level:
      shell: "getprop {prop}"
    cost: 2

  - id: adb_getprop_dumpsys
    display_name: ADB getprop / dumpsys
    executor: adb
    requires_caps: [read_system_data]
    needs_vlm: false
    low_level:
      shell: "{shell_command}"   # 由 capability 内部根据 data_kind 渲染：sim/operator/model/...
    cost: 1

ui:
  shown_in_settings: true
  examples: ["1. 手机内安装 sim 卡", "前置：本机号码已就绪"]
