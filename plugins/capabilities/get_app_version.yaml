id: get_app_version
display_name: 读取应用版本
event_kind: get_app_version
category: system
description: |
  用 dumpsys package 读目标包的 versionName / versionCode。
  前置写「客户端版本 ≥x.y」时走这条，不要看图猜版本。
platforms: [android]
trigger_phrases: [版本号, 客户端版本, 应用版本, versionName]
needs_vlm: false

implementations:
  - id: adb_dumpsys_package
    display_name: ADB dumpsys package
    executor: adb
    requires_caps: [read_system_data]
    needs_vlm: false
    low_level:
      shell: "dumpsys package {package}"
    cost: 1

  - id: remote_dumpsys_package
    display_name: Remote dumpsys package
    executor: remote
    requires_caps: [read_system_data]
    needs_vlm: false
    low_level:
      shell: "dumpsys package {package}"
    cost: 2

ui:
  shown_in_settings: true
  examples: ["客户端版本 ≥1.3.0"]
