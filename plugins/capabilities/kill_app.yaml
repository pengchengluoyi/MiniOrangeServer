id: kill_app
display_name: 强制结束应用
event_kind: kill_app
category: app_lifecycle
description: 强制结束应用进程（设置 → 应用信息 → 强制停止）
platforms: [android]
trigger_phrases: [强制结束, 杀进程, kill]
needs_vlm: false

implementations:
  - id: adb_force_stop
    display_name: ADB force-stop
    executor: adb
    requires_caps: [app_force_stop]
    needs_vlm: false
    low_level:
      shell: "am force-stop {package}"
    cost: 1

  - id: persona_force_stop_settings
    display_name: 拟人化（设置→应用信息→强制停止）
    executor: ai_persona
    requires_caps: [ui_native_input, ui_screenshot]
    needs_vlm: true
    prompt_template: PERSONA_FORCE_STOP_VIA_SETTINGS
    expands_to_events: true
    cost: 12
    description: |
      ClawNode 无 force-stop 权限时的标准路径：系统设置 → 应用 → 应用信息 → 强制停止。

ui:
  shown_in_settings: true
