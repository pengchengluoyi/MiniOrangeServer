name: Build MiniOrange Application

# 触发条件：推送到 main 分支，或者手动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 🔥 必须添加写权限，否则无法创建 Release 和 Tag
permissions:
  contents: write

jobs:
  # 1. 任务：提取版本号
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Version from main.py
        id: get_version
        shell: python
        run: |
          import re, os
          with open("main.py", "r", encoding="utf-8") as f:
              content = f.read()
          # 正则匹配 "version": "x.x.x"
          match = re.search(r'"version":\s*"([^"]+)"', content)
          version = match.group(1) if match else "0.0.0"
          print(f"Detected version: {version}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              print(f"version={version}", file=fh)

  build:
    needs: check-version
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 同时在 Windows 和 macOS 上运行
        os: [windows-latest, macos-latest]

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 🔥 显式安装 OCR 核心依赖
        pip install opencv-python rapidocr-onnxruntime onnxruntime numpy
        pip install -r requirements.txt

    # 4. 执行打包脚本
    - name: Run Build Script
      run: |
        python build.py

    # 5. 压缩打包结果 (Windows) - 🔥🔥🔥 核心修改：改用 7z 🔥🔥🔥
    # 7z 速度极快，几万个文件也能在 1-2 分钟内搞定，彻底解决 PowerShell 卡死问题
    - name: Zip Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        7z a -tzip miniorange-win-amd64.zip "dist\MiniOrangeServer_v*"

    # 6. 压缩打包结果 (macOS)
    - name: Zip Build (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r ../miniorange-macos-arm64.zip MiniOrangeServer_v*
        cd ..

    # 7. 上传 Artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}
        path: miniorange-*.zip
        retention-days: 1

  release:
    needs: [build, check-version]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/miniorange-win-amd64.zip
            artifacts/miniorange-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}